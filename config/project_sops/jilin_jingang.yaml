project_id: "jilin_jingang_jinzhou"
project_name: "吉林金钢（锦州港→四平）铁矿发运项目"
status: "active"
version: "v0.2"
source_of_truth: "git"
sop_type: "ordinary_freight"

# 吉林金钢（锦州港→四平）铁矿发运项目 SOP v0.2
# 兼容当前 SOPWatcher / load_project_sop 解析器：顶层保留 project_id / project_name / status。
# 业务内容保留完整 canonical SOP 结构，供后续实现对照。

project_meta:
  category: "normal_freight"
  dashboard: "normal_freight"
  origin_station: "高桥镇"
  destination_station: "四平"
  cargo_names:
    - "红土镍矿"
    - "镍矿"
    - "铁矿粉"
  has_inspection_slip: false
  departure_confirmation_source: "handwritten_list_or_text_report"
  source_of_truth: "git"

  # ── R76: 已发运重量计算规则(集装箱 / 按箱数) ─────────────────
  # 用 sop-data-hub/src/ops_hub/calc DSL 表达。集装箱业务约定:每箱 32.3 吨,
  # 不依赖 marked_weight(它是铁路计费重量)。每节车通常 2 个箱(cargo_count=2)。
  # 业务事实见 Hindsight memory doc: biz-rule-marked-weight-vs-loaded-weight-20260601
  shipped_weight_rule:
    per_wagon:
      op: multiply
      lhs: $wagon.cargo_count
      rhs: 32.3

scope:
  description:
    - 从微信群接收放货信息、货运信息、装车发运通知
    - 建立放货批次与车辆发运关系
    - 查询95306获取运单与车号
    - 生成发运excel与工厂系统json
    - 持续跟踪95306状态直至确认收货
  excludes:
    - 不定义python脚本文件名
    - 不定义telegram联系人
    - 不定义HTTP实现细节
    - 不定义数据库schema
    - 不定义OCR/VLM模型实现

groups:
  - id: "GROUP001"
    name: "铁晟业务工作群-[GROUP001]"
    role:
      - "接收出港计划通知单"
      - "接收装车发运通知"
    message_types:
      - "release_notice_image"
      - "departure_text"
  - id: "GROUP005"
    name: "金钢铁矿发运群-[GROUP005]"
    role:
      - "接收出港计划通知单"
      - "接收货运信息"
      - "报送发运excel"
    message_types:
      - "release_notice_image"
      - "freight_detail_text"
      - "departure_excel"
  - id: "GROUP013"
    name: "数据单发群"
    role:
      - "补充放货信息"
      - "补充货运信息"
      - "补充装车发运信息"
      - "测试阶段发送发运excel"
    message_types:
      - "release_notice_image"
      - "freight_detail_text"
      - "departure_text"
      - "departure_excel_test"

freight_detail_text_patterns:
  - "标识号"
  - "订单标识"
  - "订单号"
  - "合同号"
  - "合同"
  - "货名"
  - "品名"
  - "详细货名"
  - "矿种"
  - "批次"

# 兼容当前 monitoring plan compiler 的监听任务结构。
listening_tasks:
  - group_id: "GROUP001"
    group_lookup_id: "[GROUP001]"
    group_name: "铁晟业务工作群"
    source_role: "primary"
    listen_options:
      image: true
      text: true
    pull_image: true
    routing:
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单]"
        target_node: "detect_release_notice"
      - message_type: "text"
        trigger_condition: "match_departure_text_template"
        target_node: "detect_departure_message"
  - group_id: "GROUP005"
    group_lookup_id: "[GROUP005]"
    group_name: "金钢铁矿发运群"
    source_role: "primary"
    listen_options:
      image: true
      text: true
      file: true
    pull_image: true
    routing:
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单]"
        target_node: "detect_release_notice"
      - message_type: "text"
        trigger_condition: "freight_detail_text"
        target_node: "enrich_release_batch"
        text_patterns:
          - "标识号"
          - "订单标识"
          - "订单号"
          - "合同号"
          - "合同"
          - "货名"
          - "品名"
          - "详细货名"
          - "矿种"
          - "批次"
      - message_type: "file"
        trigger_condition: "departure_excel"
        target_node: "submit_or_hold_delivery"
  - group_id: "GROUP013"
    group_lookup_id: "[GROUP013]"
    group_name: "数据单发群"
    source_role: "supplemental"
    listen_options:
      image: true
      text: true
      file: true
    pull_image: true
    routing:
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单]"
        target_node: "detect_release_notice"
        supplemental: true
      - message_type: "text"
        trigger_condition: "freight_detail_text"
        target_node: "enrich_release_batch"
        text_patterns:
          - "标识号"
          - "订单标识"
          - "订单号"
          - "合同号"
          - "合同"
          - "货名"
          - "品名"
          - "详细货名"
          - "矿种"
          - "批次"
        supplemental: true
      - message_type: "text"
        trigger_condition: "match_departure_text_template"
        target_node: "detect_departure_message"
        supplemental: true
      - message_type: "file"
        trigger_condition: "departure_excel_test"
        target_node: "submit_or_hold_delivery"
        supplemental: true

sources:
  wechat_chat_records:
    type: "jsonl"
    path: "wx-ops-agent/data/chat_records/**/*.jsonl"
    role: "微信消息事实源"
  wechat_images:
    type: "image_directory"
    path: "~/Documents/bussiness-artifacts/wechat_images"
    role: "原始通知单图片保存"
  sop_agent_db:
    type: "sqlite"
    path: "sop-data-hub/data/sop_agent.db"
    role: "普通货运业务数据库"
  railway_95306:
    type: "sqlite"
    path: "95306_collection.sqlite3"
    role: "95306运输状态数据库"

entities:
  release_batch:
    description: "放货批次"
    uniqueness:
      - "order_identifier"
      - "contract_no"
    rules:
      - "不同标识号不得合并"
      - "不同合同号不得合并"
      - "同船名允许多个release_batch"
    fields:
      - "ship_name"
      - "destination"
      - "quantity"
      - "cargo_name"
      - "order_identifier"
      - "contract_no"
      - "cargo_name_detail"
  wagon_shipment:
    description: "发运车辆记录"
    uniqueness:
      - "wagon_no"
      - "waybill_no"
      - "release_batch_id"

states:
  release_batch:
    - "pending_release_notice"
    - "release_batch_created"
    - "freight_detail_enriched"
    - "waiting_departure"
    - "departure_in_progress"
    - "arrived_destination"
    - "delivered"
    - "confirmed_received"
    - "closed"
  wagon_shipment:
    - "pending_match"
    - "waiting_95306"
    - "dispatched"
    - "arrived"
    - "delivered"
    - "confirmed_received"

flows:
  release_notice_flow:
    trigger:
      groups:
        - "GROUP001"
        - "GROUP005"
        - "GROUP013"
      message_types:
        - "release_notice_image"
        - "release_notice_text"
    steps:
      - node: "detect_release_notice"
        action:
          - "classify_message"
          - "extract_release_notice_json"
        outputs:
          - "release_notice_json"
      - node: "identify_project"
        conditions:
          any_keywords:
            - "四平"
            - "吉林金钢"
        outputs:
          - "project_candidate"
      - node: "find_existing_release_batch"
        action:
          - "query_release_batches"
        match_fields:
          - "order_identifier"
          - "contract_no"
          - "ship_name"
          - "destination"
      - node: "create_or_update_release_batch"
        conditions:
          existing_batch_found: false
        action:
          - "create_release_batch"
        outputs:
          - "release_batch_created"
      - node: "update_existing_release_batch"
        conditions:
          existing_batch_found: true
        action:
          - "update_release_batch_fields"
  freight_detail_flow:
    trigger:
      groups:
        - "GROUP005"
        - "GROUP013"
      message_types:
        - "freight_detail_text"
      text_patterns:
        - "订单标识"
        - "标识号"
        - "订单号"
        - "合同号"
        - "入厂合同号"
        - "入场合同号"
        - "合同"
        - "货名"
        - "品名"
        - "详细货名"
        - "矿种"
        - "批次"
        - "放货"
    extract_fields:
      - "order_identifier"
      - "contract_no"
      - "cargo_name_detail"
      - "port"
      - "quantity_tons"
    binding_rule: "manual_only"
    binding_reason: "freight_detail_text 不含船名，无法自动绑定到 release_batch。需 Agent 或人工指定绑定。"
    action:
      - "extract_freight_detail"
    outputs:
      - "freight_detail_candidate"
    no_auto_bind:
      - "release_batch"
      - "ship_name"
  departure_flow:
    trigger:
      groups:
        - "GROUP001"
        - "GROUP013"
      message_patterns:
        - ".*四平.*"
        - ".*四平铁.*"
        - ".*四平镍.*"
        - ".*\\d{1,3}\\s*(车|节).*"
        - ".*(煤六|九道|十四道|\\d+道).*"
    examples:
      - "6道，四平铁，46车"
      - "6道，四平方向，长航滨海，46车"
      - "十四道，四平铁，蓝鳍，18车"
      - "28节四平铁，蓝鳍（26-60位）"
      - "煤六   四平铁\"蓝鳍\"18节"
      - "九道   四平镍\"长航滨海\"46节"
      - "十四道 41节 四平铁 厦门世纪"
      - "煤六 39节 四平铁 智慧"
    text_semantics:
      car_units: "\"车\" 和 \"节\" 等价为 car_count"
      ship_name_position: "船名可能在车数前，也可能在车数后"
      ship_name_quotes: "船名可能被中文引号包裹"
      lane_or_track: "\"煤六\"、\"九道\"、\"十四道\" 等为 lane_or_track"
      position_range: "括号内 \"26-60位\" 保留为 raw_text，不作为独立字段；如有意义后期扩展"
    steps:
      - node: "detect_departure_message"
        action:
          - "parse_departure_text"
        extract_fields:
          - "message_time"
          - "destination"
          - "car_count"
          - "optional_ship_name"
      - node: "build_95306_query_window"
        action:
          - "build_time_window"
        query_window:
          start: "message_time - 60m"
          end: "message_time + 60m"
      - node: "query_95306"
        action:
          - "query_95306_waybills"
        outputs:
          - "waybill_candidates"
      - node: "query_result_found"
        conditions:
          waybill_candidates_found: false
        action:
          - "create_pending_task"
        outputs:
          - "pending_departure_candidate"
      - node: "extract_wagons_and_waybills"
        conditions:
          waybill_candidates_found: true
        action:
          - "extract_wagon_no"
          - "extract_container_no"
          - "extract_waybill_no"
      - node: "deduplicate_departure_records"
        action:
          - "check_existing_wagon_shipments"
        duplicate_policy:
          existing_record: "ignore"
          partial_record: "enrich_only"
      - node: "match_release_batch"
        action:
          - "bind_wagons_to_release_batch"
      - node: "write_departure_records"
        action:
          - "create_wagon_shipments"
        outputs:
          - "departure_records_written"
      - node: "generate_departure_excel"
        action:
          - "generate_departure_excel_task"
        outputs:
          - "departure_excel"
      - node: "generate_factory_json"
        action:
          - "generate_factory_transport_json_task"
        outputs:
          - "factory_transport_json"
      - node: "delivery_target_test"
        action:
          - "dry_run_receiver_system"
        expected:
          response_code: 200
      - node: "send_test_excel"
        runtime_rules:
          test_mode:
            receiver: "郭东北"
        action:
          - "send_excel_task"
      - node: "telegram_json_delivery"
        runtime_rules:
          test_mode: true
        action:
          - "telegram_json_delivery_task"
      - node: "enter_tracking_phase"
        next:
          - "track_95306_status"
    output_templates:
      departure_excel:
        business_name: "发运 Excel"
        file_naming:
          pattern: "吉林金钢_发运数据_{yyyymmdd}_{car_count}车.xlsx"
          date_source_priority:
            - "waybill_made_date"
            - "bill_created_date"
            - "shipment_document_date"
            - "message_date"
          car_count_source: "export_row_count"
        workbook:
          sheet_name: "sheet1"
          title:
            row: 1
            range: "A1:N1"
            text: "高桥镇装车发运明细"
            merge_cells: true
          header_row: 2
          data_start_row: 3
        columns:
          - key: "seq"
            header: "序号"
            fill_rule: "从1开始自增"
          - key: "supplier_name"
            header: "供应商名称"
            fill_rule: "留空"
          - key: "detail_account"
            header: "明细户"
            fill_rule: "留空"
          - key: "wagon_no"
            header: "车皮号"
            fill_rule: "车号"
          - key: "container_no_1"
            header: "箱号1"
            fill_rule: "该车第一个箱号"
          - key: "container_no_2"
            header: "箱号2"
            fill_rule: "该车第二个箱号"
          - key: "loading_date"
            header: "装车日期"
            fill_rule: "制单日期，yyyy-mm-dd"
          - key: "entry_date"
            header: "进场日期"
            fill_rule: "装车日期+30天，yyyy-mm-dd"
          - key: "cargo_name"
            header: "货名"
            fill_rule: "严格按放货批次货物品名原文填写，不得自行泛化为铁矿"
          - key: "ship_name"
            header: "船名"
            fill_rule: "船名"
          - key: "entry_contract_no"
            header: "入场合同号"
            fill_rule: "按放货批次货运信息填写"
          - key: "order_identifier"
            header: "订单标识号"
            fill_rule: "按放货批次货运信息填写"
          - key: "original_departure_weight"
            header: "原发重量"
            fill_rule: "留空"
          - key: "shipment_count_type"
            header: "次数"
            fill_rule: "固定填写：单次"
        style:
          title:
            merge_cells: true
            horizontal_alignment: "center"
          table:
            bordered_range: "A2:N{last_data_row}"
            border_style: "thin"
            apply_border_to_header: true
            apply_border_to_body: true
            body_main_structure_has_border: true
    factory_upload_config:
      endpoint: "http://111.26.178.96:88/prod-api"
      login_path: "/auth/login"
      upload_path: "/sales/transportOrder/insert"
      auth:
        username: "saibin"
        token_header: "Admin-Token"
      payload_fields:
        wagonNumber:
          source: "95306_confirm"
          description: "车号"
        boxNumber:
          source: "95306_confirm"
          description: "箱号，双箱拆成两条独立记录"
        goodName:
          source: "release_batch.cargo_name"
          description: "货名，严格按放货批次货物品名原文"
        boatName:
          source: "release_batch.ship_name"
          description: "船名"
        contractNumber:
          source: "release_batch.factory_contract_no"
          description: "工厂采购合同号，非运输合同号"
        orderId:
          source: "release_batch.order_identifier"
          description: "订单标识"
        numberTime:
          source: "fixed"
          value: "单次"
          description: "工厂系统协议固定值"
        formId:
          source: "fixed"
          value: "MR07"
          description: "工厂系统协议固定值"
        first:
          source: "fixed"
          value: "高桥镇装车发运明细"
          description: "发站名+装车发运明细，固定值"
      excel_to_factory_mapping:
        "合同号": "contractNumber"
        "订单标识": "orderId"
        "货名": "goodName"
        "车号": "wagonNumber"
        "箱号": "boxNumber"
        "船名": "boatName"
      verify:
        endpoint: "http://111.26.178.96:88/prod-api/sales/transportOrder/list"
        method: "GET"
        params:
          pageNum: 1
          pageSize: 100
          orderId: "{order_identifier}"
          formId: "MR07"
        check:
          - "total == expected_count"
          - "all boxNumber values match"
    delivery_targets:
      dev:
        type: "wechat_contact"
        name: "郭东北"
        bridge: "wx-ui-bridge"
        send_via: "src/ops_hub/sop/send_excel.py"
  tracking_flow:
    trigger:
      - "dispatched_wagon_exists"
    steps:
      - node: "track_95306_status"
        action:
          - "poll_shipment_snapshots"
        tracked_status:
          - "发车"
          - "到站"
          - "交付"
      - node: "arrived_destination"
        conditions:
          95306_status: "到站"
        action:
          - "update_dashboard_state"
          - "update_wagon_arrival_status"
      - node: "delivered"
        conditions:
          95306_status: "交付"
        action:
          - "update_dispatch_status"
      - node: "confirmed_received"
        conditions:
          any:
            - "95306_delivered_stable"
            - "receiver_system_confirmed"
            - "manual_confirmation"
        action:
          - "mark_confirmed_received"
          - "close_dashboard_state"

runtime:
  watcher:
    enabled: true
    hot_reload: true
  sop_reload:
    source_of_truth: "git"
    watch_directory: "config/project_sops/"
  idempotency:
    message:
      unique_key:
        - "group_id"
        - "seq"
    wagon_shipment:
      unique_key:
        - "wagon_no"
        - "waybill_no"
        - "release_batch_id"
  task_resolver:
    departure_excel:
      task_type: "excel_generation"
    factory_json:
      task_type: "json_generation"
    telegram_delivery:
      task_type: "telegram_delivery"
    receiver_upload:
      task_type: "http_delivery"

exceptions:
  - name: "ocr_incomplete"
    action:
      - "create_todo"
      - "preserve_original_image"
  - name: "unmatched_release_batch"
    action:
      - "create_manual_review_task"
  - name: "95306_query_empty"
    action:
      - "create_pending_departure_candidate"
  - name: "shipment_count_mismatch"
    action:
      - "require_manual_confirmation"
  - name: "duplicate_message"
    action:
      - "enrich_only"
      - "no_duplicate_insert"
  - name: "receiver_system_not_200"
    action:
      - "mark_delivery_failed"
      - "create_retry_task"

archive:
  matched:
    images:
      path: >
        projects/jilin_jingang_jinzhou/
        <destination>/<ship_name>/lot<order_identifier>/images/
    json:
      path: >
        projects/jilin_jingang_jinzhou/
        <destination>/<ship_name>/lot<order_identifier>/json/
  unmatched:
    images:
      path: "unmatched/<YYYY-MM>/images/"
    json:
      path: "unmatched/<YYYY-MM>/json/"

acceptance:
  - "不同标识号不得合并为同一release_batch"
  - "发运文字必须触发95306查询"
  - "查询窗口必须使用消息时间±60分钟"
  - "车号与运单必须落库"
  - "发运excel不得硬编码船名"
  - "发运json必须可生成"
  - "95306状态必须持续跟踪"
  - "已交付车辆不得长期停留in_progress"
  - "confirmed_received后dashboard必须closed"
