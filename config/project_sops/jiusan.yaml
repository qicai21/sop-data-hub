project_id: "jiusan"
project_name: "九三大豆铁路发运项目"
status: "active"

# 九三大豆项目初始化 SOP
# 当前边界:
# - 不自动跟踪检装车通知单.
# - 不自动识别或跟踪放货单.
# - 放货单由用户发送后手动指认项目、路线和发运信息.
# - 系统后续从 xts 账号 95306 数据查询每日发车动态.

# ── 项目元(#85 2026-06-06 补全)──────────────────────────────
# 即便九三 SOP 自动化程度低,跟踪模式跟其他全程项目一致:发车后跟到货。
project_meta:
  category: "grain_freight"
  dashboard: "normal_freight"
  origin_station: "高桥镇"
  destination_station: "新台子"
  cargo_names:
    - "大豆"
  transport_modes:
    - "铁路"
  has_inspection_notice: false
  departure_confirmation_source: "rail95306_xts_account"
  # 全程跟踪到 confirmed_received。九三大豆结算同样依赖到货,跟 jilin/中唐
  # 同模式。当前 SOP 自动化未实现的部分不影响 lifecycle 语义。
  lifecycle:
    mode: "full_track_to_received"
    rationale: "粮食结算依赖到货时间;wagon 全部到货才标 confirmed_received"
  # 装车重量(2026-06-15 收口,替代 sync 脚本里的硬算常量):
  #   集装箱 lot(transport_mode 含"集装箱")→ box 数 × 28.4t,数据在
  #     wagon_container_shipments(box 级)→ 走 container 源。
  #   散粮/整车 lot → 按车型标载:L70=69t,其余(L16/L18)=61t,数据在
  #     wagon_shipments → 走 bulk 源(默认)。
  shipped_weight_rule:
    container:
      per_box:
        op: to_float
        value: 28.4
    bulk:
      per_wagon:
        op: lookup_by_prefix
        value: "$wagon.car_model"
        prefix_map:
          L70: 69
        on_miss: 61

rail95306:
  account: "xts"
  cargo_name: "大豆"
  origin_station: "高桥镇"
  primary_routes:
    - mode: "container"
      destination_station: "新台子"
      private_line: "三三〇处专用线"
      final_destination: "九三集团铁岭大豆科技有限公司工厂院内"
      note: "集装箱常规路线, 三三〇处专用线卸车后汽运短倒至工厂"
    - mode: "bulk_grain_wagon"
      wagon_alias: "K车"
      destination_station: "新台子"
      private_line: "九三集团铁岭大豆科技有限公司专用线"
      final_destination: "九三集团铁岭大豆科技有限公司工厂院内"
      note: "散粮车/K车常规路线, 厂内专用线直接卸货, 一次约容纳20车"
  supplemental_routes:
    - mode: "open_top_container"
      destination_station: "得胜台"
      final_destination: "九三集团铁岭大豆科技有限公司工厂院内"
      note: "新台子接卸能力不足时启用, 平时不发"

