<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>放货 / 发运 / 图片识别 / 匹配入库看板</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 24px; color: #1f2937; background: #f8fafc; }
h1 { margin-bottom: 4px; }
.meta { color: #64748b; margin-bottom: 20px; font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 18px 0; }
.card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
.card .label { color: #64748b; font-size: 13px; }
.card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
.card .error { color: #dc2626; }
table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #e2e8f0; margin-bottom: 16px; }
th, td { border: 1px solid #e2e8f0; padding: 8px; vertical-align: top; font-size: 13px; }
th { background: #e0f2fe; position: sticky; top: 0; }
.path { max-width: 260px; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.empty { text-align: center; color: #64748b; padding: 24px; }
.section-title { margin-top: 24px; }
.error-banner { background: #fee2e2; border: 1px solid #fecaca; padding: 16px; border-radius: 8px; margin-bottom: 16px; color: #991b1b; }
.loading { text-align: center; padding: 48px; color: #64748b; font-size: 16px; }
.refresh-btn { display: inline-block; margin-left: 12px; padding: 4px 12px; font-size: 13px; cursor: pointer; background: #e0f2fe; border: 1px solid #7dd3fc; border-radius: 6px; color: #0369a1; }
.refresh-btn:hover { background: #bae6fd; }
.refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<h1>放货记录 / 发运记录 / 图片下载识别 / 匹配入库看板 <button id="refresh-btn" class="refresh-btn" onclick="doRefresh()" title="通过 /api/refresh 刷新数据">🔄 刷新数据</button></h1>
<div id="meta-bar" class="meta">加载中...</div>
<div id="error-banner" class="error-banner" style="display:none"></div>
<div id="loading" class="loading">正在加载 dispatch_board_data.json...</div>
<div id="summary-cards" class="cards" style="display:none"></div>
<h2 id="pending-title" class="section-title" style="display:none">待落实消息汇总（优先处理）</h2>
<div id="pending-items-section"></div>
<div id="active-release-batches-section"></div>
<div id="completed-release-batches-section"></div>

<script>
(function() {
'use strict';

var SUMMARY_CARDS = [
  {key: 'pending_total',                  label: '待落实总数（文字/出港计划/检装车）'},
  {key: 'pending_text_release',           label: '待匹配文字放货消息'},
  {key: 'pending_release_plan_images',    label: '待匹配出港计划/放货图片'},
  {key: 'pending_inspection_assignment',  label: '待指认检装车通知单'},
  {key: 'pending_95306_check',            label: '待95306校验装车候选'},
  {key: 'active_release_batches',         label: '当前发运中批次数'},
  {key: 'release_batch_total',            label: 'release_batch 总数'},
  {key: 'matched_inspection_candidates',  label: '已匹配检装车候选数（含已正式入库）'},
  {key: 'manual_candidate_count',         label: '待人工匹配候选数'},
  {key: 'unassigned_candidate_count',     label: '未分配待人工候选数'},
  {key: 'formal_wagon_count',             label: '已正式入库车数'},
  {key: 'formal_weight',                  label: '已正式入库重量'}
];

var PENDING_COLUMNS = [
  {key: 'display_type', label: '类型'},
  {key: 'ship_name',    label: '船名'},
  {key: 'cargo_name',   label: '货名'},
  {key: 'quantity',     label: '数量/车数'},
  {key: 'plan_no',      label: '计划号'},
  {key: 'contract_no',  label: '合同号'},
  {key: 'status',       label: '状态'},
  {key: 'reason',       label: '原因'},
  {key: 'candidate_lots', label: '候选 lot'},
  {key: 'source_image_path', label: '来源'},
  {key: 'source_json_path',  label: 'JSON'},
  {key: 'recorded_at',  label: '记录时间'}
];

var BATCH_COLUMNS = [
  {key: 'project',              label: '项目'},
  {key: 'ship_name',            label: '船名'},
  {key: 'destination_station',  label: '到站'},
  {key: 'batch_sequence',       label: 'lot'},
  {key: 'planned_quantity',     label: '计划吨数'},
  {key: 'batch_date',           label: '批次日期'},
  {key: 'cargo_category',       label: '货物品类'},
  {key: 'cargo_product_name',   label: '货物品名'},
  {key: 'plan_no',              label: '计划号/订单号'},
  {key: 'contract_no',          label: '合同号'},
  {key: 'status',               label: '当前状态'},
  {key: 'matched_candidate_count', label: '已匹配候选数'},
  {key: 'manual_candidate_count',  label: '待人工候选数'},
  {key: 'candidate_lots',       label: '候选 lot 列表'},
  {key: 'formal_wagon_count',   label: '已正式入库车数'},
  {key: 'formal_shipments',     label: '已发运车辆明细', special: 'carDetail'},
  // R76 — yaml shipped_weight_rule(替代老 formal_weight + remaining_quantity)
  {key: 'shipped_weight_tons',    label: '已发运重量(吨)', special: 'num'},
  {key: 'remaining_weight_tons',  label: '剩余可发运(吨)', special: 'num'},
  {key: 'unresolved_wagon_count', label: '待人工核重车数'},
  {key: 'source_image_path',    label: '原始图片', special: 'fileLink'},
  {key: 'extraction_json_path', label: 'JSON', special: 'fileLink'}
];

function esc(v) {
  if (v == null || v === '') return '';
  var s = String(v);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtNum(v) {
  if (v == null || v === '' || v === '待计算') return '待计算';
  var n = Number(v);
  if (isNaN(n)) return esc(v);
  if (n === Math.floor(n)) return String(n);
  var s = n.toFixed(3);
  s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}

function fileUrl(path) {
  if (!path || path === '待补充') return '';
  return 'file://' + encodeURI(path);
}

function fileLink(path, label) {
  if (!path || path === '待补充') return '待补充';
  var url = fileUrl(path);
  var name = path.split('/').pop() || path;
  if (!label) label = name;
  return '<a href="' + esc(url) + '" title="' + esc(path) + '">' + esc(label) + '：' + esc(name) + '</a>';
}

function td(val, special) {
  if (special === 'carDetail') return renderCarDetails(val);
  if (special === 'fileLink') return '<td class="path">' + fileLink(String(val||''), '打开') + '</td>';
  if (special === 'num') return '<td>' + fmtNum(val) + '</td>';
  return '<td>' + esc(val) + '</td>';
}

function renderCarDetails(shipments) {
  if (!shipments || !shipments.length) return '<td></td>';
  var rows = shipments.map(function(item) {
    var inspectionLink = item.inspection_file ? fileLink(item.inspection_file, '检装车单') : '';
    return '<tr><td>' + esc(item.car_no) + '</td><td>' + esc(item.time) + '</td><td>' + inspectionLink + '</td></tr>';
  }).join('');
  return '<td><details><summary>查看 ' + shipments.length + ' 车</summary>' +
    '<table class="car-table"><thead><tr><th>车号</th><th>时间</th><th>检装车通知单</th></tr></thead><tbody>' +
    rows + '</tbody></table></details></td>';
}

function renderTable(columns, rows, emptyText) {
  var headerHtml = '<tr>' + columns.map(function(c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '</tr>';
  if (!rows || !rows.length) {
    return '<table><thead>' + headerHtml + '</thead><tbody><tr><td colspan="' + columns.length + '" class="empty">' + (emptyText || '暂无数据') + '</td></tr></tbody></table>';
  }
  var bodyHtml = rows.map(function(row) {
    return '<tr>' + columns.map(function(c) {
      return td(row[c.key], c.special);
    }).join('') + '</tr>';
  }).join('');
  return '<table><thead>' + headerHtml + '</thead><tbody>' + bodyHtml + '</tbody></table>';
}

function renderMeta(meta) {
  var el = document.getElementById('meta-bar');
  var parts = [];
  if (meta.generated_at) parts.push('生成时间：' + esc(meta.generated_at));
  if (meta.refresh_reason) parts.push('刷新原因：' + esc(meta.refresh_reason));
  if (meta.source_db) parts.push('业务库：' + esc(meta.source_db));
  if (meta.rail95306_db) parts.push('95306正式匹配库（只读）：' + esc(meta.rail95306_db));
  el.textContent = parts.join('；');
}

function renderSummary(summary) {
  var container = document.getElementById('summary-cards');
  container.innerHTML = SUMMARY_CARDS.map(function(card) {
    var val = summary[card.key];
    var display = card.key === 'formal_weight' ? fmtNum(val) : esc(val);
    return '<div class="card"><div class="label">' + esc(card.label) + '</div><div class="value">' + display + '</div></div>';
  }).join('');
  container.style.display = 'grid';
}

function renderPendingItems(items) {
  var container = document.getElementById('pending-items-section');
  var title = document.getElementById('pending-title');
  title.style.display = '';
  container.innerHTML = renderTable(PENDING_COLUMNS, items, '暂无未匹配待落实消息');
}

function renderReleaseBatches(batches) {
  var activeContainer = document.getElementById('active-release-batches-section');
  var completedContainer = document.getElementById('completed-release-batches-section');

  var active = batches.filter(function(b) { return b.status !== '已发完'; });
  var completed = batches.filter(function(b) { return b.status === '已发完'; });

  activeContainer.innerHTML = '<h2 class="section-title">正式匹配汇总 / 发运中 release_batch 明细</h2>' +
    renderTable(BATCH_COLUMNS, active, '暂无发运中 release_batch 数据');

  completedContainer.innerHTML = '<h2 class="section-title">已发完 release_batch 明细</h2>' +
    renderTable(BATCH_COLUMNS, completed, '暂无已发完 release_batch 数据');
}

function showError(msg, isBackendError) {
  var loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';
  var banner = document.getElementById('error-banner');
  banner.innerHTML = '<strong style="display:block;margin-bottom:8px">⚠️ 无法加载 dispatch_board_data.json</strong>' +
    '<div>' + esc(msg) + '</div>';

  // Suggest solutions
  var tips = [];
  var proto = window.location.protocol;
  if (proto === 'file:') {
    tips.push('<strong>当前通过 file:// 打开，浏览器限制 fetch 请求。</strong>');
    tips.push('推荐使用 HTTP 方式打开：<br><code style="background:#1e293b;color:#e2e8f0;padding:2px 6px;border-radius:3px">python -m sop_hub dispatch-board serve</code>');
    tips.push('然后访问 <code style="background:#1e293b;color:#e2e8f0;padding:2px 6px;border-radius:3px">http://127.0.0.1:8765/dispatch_board.html</code>');
  } else {
    tips.push('请确认 dispatch_board_data.json 与 dispatch_board.html 在同一目录。');
    if (!isBackendError) {
      tips.push('请运行 <code style="background:#1e293b;color:#e2e8f0;padding:2px 6px;border-radius:3px">python -m sop_hub dispatch-board</code> 生成数据文件。');
    }
  }
  banner.innerHTML += '<ul style="margin-top:10px;padding-left:18px"><li>' + tips.join('</li><li>') + '</li></ul>';
  banner.style.display = 'block';
}

function renderDashboard(data) {
  document.getElementById('loading').style.display = 'none';

  // Detect backend error JSON
  var meta = data.meta || {};
  if (meta.error === true || meta.error === 'true') {
    showError('后端错误：' + (meta.error_message || '未知错误'), true);
    return;
  }

  renderMeta(meta);
  renderSummary(data.summary || {});
  renderPendingItems(data.pending_items || []);
  renderReleaseBatches(data.release_batches || []);
  // Collapse all car details panels after data loads
  var details = document.querySelectorAll('details[open]');
  for (var i = 0; i < details.length; i++) { details[i].open = false; }
}

function loadDashboardData() {
  fetch('./dispatch_board_data.json?ts=' + Date.now())
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
      return resp.json();
    })
    .then(function(data) {
      renderDashboard(data);
    })
    .catch(function(err) {
      showError('加载失败: ' + err.message, false);
    });
}

function doRefresh() {
  var btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '⏳ 刷新中...';

  fetch('/api/refresh')
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(result) {
      if (!result.ok) throw new Error(result.error || '刷新失败');
      // Reload data with cache busting
      loadDashboardData();
    })
    .catch(function(err) {
      showError('刷新失败: ' + err.message, false);
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '🔄 刷新数据';
    });
}

loadDashboardData();

})();
</script>
</body>
</html>
