project_id: "zhongtang_special_steel"
project_name: "中唐特钢铁矿发运项目"
status: "active"
sop_type: "freight_rail"
source_of_truth: "git"

# ── 项目元信息(数据约束的入口,被 ingest/filter 代码读取)─────────────
# 参考 jilin_jingang 和 chaoyang 的 project_meta 结构。
project_meta:
  category: "iron_ore"
  dashboard: "normal_freight"
  origin_station: "高桥镇"
  destination_station: "汐子"
  cargo_names:
    - "铁矿"
    - "铁矿粉"
  # #98 filter:本项目合同明确只走铁路。出港通知单的 remarks 里"(公路 X)"
  # 这种 ingest 时按 scope 过滤掉(2026-06-04 跟 jilin 蓝鳍同性质问题)。
  transport_modes:
    - "铁路"
  has_inspection_notice: true
  # 已见过的船名,辅助识别 / 文字补充货运信息时对船名一致性核对。
  # 中唐是海铁联运两段船:A船青岛进口 → B船内贸转水到锦州港。
  # 数据库:import_ship_name 存大船(A),ship_name 存到港船(B)。
  # 当中唐特钢发运群的补充货运消息船名 ≠ 出港通知单船名时:
  #   import_ship_name <- 补充货运消息船名(进口段大船)
  #   ship_name        <- 出港通知单船名(到港小船)
  # 一致时只填 ship_name,import_ship_name 留空。
  known_ships:
    - "丰收散运"
    - "鞍子河"
    - "马兰探险"
  # OCR 常见误识(汐子 ⇄ 沙子),ingest 时归一到汐子。
  destination_aliases:
    汐子: ["沙子"]

# 该项目需要的监听任务清单
listening_tasks:
  - group_id: "GROUP003"
    group_lookup_id: "[GROUP003]"
    group_name: "中唐特钢发运群"
    wxid: "38739555499@chatroom"
    listen_options:
      image: true
      text: true
    pull_image: true
    # 触发后进入的业务流
    routing:
      - message_type: "text"
        trigger_condition: "match_text_template"
        target_node: "create_release_batch"
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单, 检装车通知单]"
        target_node: "process_business_image"

  - group_id: "GROUP001"
    group_lookup_id: "[GROUP001]"
    group_name: "铁晟业务工作群"
    wxid: "18919596289@chatroom"
    listen_options:
      image: true
    pull_image: true
    routing:
      - message_type: "image"
        trigger_condition: "category_in:[检装车通知单]"
        target_node: "process_inspection_slip"
        report_targets:
          dev:
            type: "contact"
            name: "郭东北"
          production:
            type: "group"
            group_id: "[GROUP003]"
            group_name: "中唐特钢发运群"

  - group_id: "GROUP013"
    group_lookup_id: "[GROUP013]"
    group_name: "数据单发群"
    wxid: "56327225598@chatroom"
    source_role: "supplemental"
    listen_options:
      image: true
      text: true
      file: true
    pull_image: true
    routing:
      - message_type: "text"
        trigger_condition: "match_text_template"
        target_node: "create_release_batch"
        supplemental: true
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单]"
        target_node: "create_release_batch"
        supplemental: true
      - message_type: "image"
        trigger_condition: "category_in:[检装车通知单]"
        target_node: "process_inspection_slip"
        supplemental: true
        report_targets:
          dev:
            type: "contact"
            name: "郭东北"
          production:
            type: "group"
            group_id: "[GROUP003]"
            group_name: "中唐特钢发运群"
