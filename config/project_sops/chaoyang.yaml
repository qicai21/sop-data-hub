project_id: "chaoyang_steel"
project_name: "朝阳钢铁铁矿发运项目"
status: "active"
version: "v0.1"
source_of_truth: "git"
sop_type: "ordinary_freight"

project_meta:
  category: "normal_freight"
  dashboard: "normal_freight"
  destination_station: "朝阳西"
  cargo_names: ["铁矿", "铁矿粉", "朝阳西铁", "朝阳西铁矿"]
  has_inspection_notice: true
  # ── 跟踪模式(#85 2026-06-06)────────────────────────────────
  # 短链 "shipped_is_completed":发运 + 鞍钢门户上传 + 反查 OK 即完结,
  # 下游不再轮询 95306 到货 / 等 confirmed_received。朝阳钢铁场景下,
  # 鞍钢收货系统接到上传记录即认收,不需 95306 二次确认。
  lifecycle:
    mode: "shipped_is_completed"
    rationale: "鞍钢门户上传 + 反查 OK 即业务完结;无需追踪 95306 到货"
  confirmed_received_rule:
    default: "95306_delivered_equals_confirmed_received"
  release_batch_policy:
    separate_notice_means_separate_release_batch: true
    same_ship_can_have_multiple_release_batches: true
    do_not_merge_release_batches: true
    sequential_lot_match_priority: true

  # ── 货运信息(2026-06-18 变更)─────────────────────────────────
  # 原规定:朝阳钢铁项目【无货运信息】。现改为【有货运信息】,由用户**单独手工提供**
  # 下列 3 字段(不从消息文本/图片自动抽取)。
  freight_info:
    has_freight_info: true
    source: "manual_user_provided"        # 用户单独提供,非自动抽取
    fields:
      contract_no:                         # 合同号,如 DL000748089_19051(= 95306 tyrjzsx 里的运单号)
        example: "DL000748089_19051"
        maps_to: "release_batches.contract_no"
      order_identifier:                    # 订单识别号 = 回运计划号
        alias: "回运计划号"
        example: "HY26052002"
        maps_to: "release_batches.order_identifier"
        usage: "鞍钢门户(56.ansteel)查 plan + 上传数据用 = upload_and_verify(transport_plan_no=...)"
      cargo_name:                          # 货物品名,如 PB粉
        example: "PB粉"
        maps_to: "release_batches.cargo_name"

  # ── 候选推断提示(infer_candidate_context 用) ─────────────────
  # 用于检装车通知单 candidate 无 ship_name 时的兜底证据打分
  daoxian_keywords: ["十四道", "十二道"]
  destination_aliases:
    朝阳西: ["朝阳铁", "朝阳"]
  cargo_aliases:
    铁矿: ["铁矿粉", "铁精粉", "朝阳西铁矿粉"]
  # 已知该项目的船名;参与文本融合的兜底匹配。新船加这里就行。
  known_ships:
    - "宝腾海"
    - "中联发"
    - "木森17"
    - "马兰幸福"

  # ── R76: 已发运重量计算规则(整车 / 按车型) ─────────────────
  # 用 sop-data-hub/src/sop_hub/calc DSL 表达。整车业务下,先取 95306
  # marked_weight(标载);为空则按 car_model 前缀回退;最终查表得"实装重量"。
  # 业务事实见 Hindsight memory doc: biz-rule-marked-weight-vs-loaded-weight-20260601
  shipped_weight_rule:
    per_wagon:
      op: lookup
      key:
        op: coalesce
        choices:
          - op: to_float
            value: $wagon.marked_weight
          - op: lookup_by_prefix
            value: $wagon.car_model
            prefix_map:
              C70: 70
              C64: 61
              C62: 60
      table:
        "70": 69
        "61": 63.5
        "60": 62.5
      on_miss: pending_review

groups:
  primary:
    group_id: "GROUP001"
    group_lookup_id: "[GROUP001]"
    group_name: "铁晟业务工作群"
    wxid: "18919596289@chatroom"
  test:
    group_id: "GROUP013"
    group_lookup_id: "[GROUP013]"
    group_name: "数据单发群"
  production_report:
    group_id: "GROUP004"
    group_lookup_id: "[GROUP004]"
    group_name: "朝钢铁矿发运群"

listening_tasks:
  - group_id: "GROUP001"
    group_lookup_id: "[GROUP001]"
    group_name: "铁晟业务工作群"
    wxid: "18919596289@chatroom"
    source_role: "primary"
    listen_options:
      image: true
      text: true
    pull_image: true
    routing:
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单]"
        target_node: "detect_release_notice"
      - message_type: "image"
        trigger_condition: "category_in:[检装车通知单]"
        target_node: "detect_inspection_notice"
      - message_type: "text"
        trigger_condition: "business_text_context"
        target_node: "capture_business_context"
  - group_id: "GROUP013"
    group_lookup_id: "[GROUP013]"
    group_name: "数据单发群"
    source_role: "supplemental"
    listen_options:
      image: true
      text: true
      file: true
    pull_image: true
    routing:
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单]"
        target_node: "detect_release_notice"
        supplemental: true
      - message_type: "text"
        trigger_condition: "business_text_context"
        target_node: "capture_business_context"
        supplemental: true

flows:
  release_notice_flow:
    description: "release notice image to release_batch"
    trigger:
      groups: ["GROUP001", "GROUP013"]
      message_types: ["image"]
      image_category: ["出港计划通知单"]
    steps:
      - node: "detect_release_notice"
        action: ["classify_message", "extract_release_notice_json"]
        outputs: ["release_notice_json"]
      - node: "identify_project"
        action: ["match_project_by_destination_and_cargo"]
        conditions:
          any_keywords: ["朝阳西", "朝钢", "朝阳钢铁"]
      - node: "find_existing_release_batch"
        action: ["query_release_batches"]
        match_fields: ["ship_name", "notice_date", "cargo_name", "quantity_tons", "destination_station"]
      - node: "create_or_update_release_batch"
        action: ["create_release_batch", "update_release_batch_fields"]
        rule:
          same_ship_new_notice_create_new_batch: true
          do_not_merge_release_batches: true
        outputs: ["release_batch"]

  inspection_notice_flow:
    description: "inspection notice image to 95306 query and wagon_shipments"
    trigger:
      groups: ["GROUP001"]
      message_types: ["image"]
      image_category: ["检装车通知单"]
    steps:
      - node: "detect_inspection_notice"
        action: ["classify_message", "extract_inspection_notice_json"]
        outputs: ["inspection_notice_json"]
      - node: "extract_inspection_notice_fields"
        action: ["extract_ship_name", "extract_destination_station", "extract_cargo_name", "extract_car_count", "extract_wagon_numbers", "extract_notice_time"]
        expected_fields: ["ship_name", "destination_station", "car_count", "wagon_numbers"]
      - node: "match_release_batch"
        action: ["match_release_batch_by_ship_destination_cargo"]
        rule:
          prefer_open_batch_same_ship_destination_cargo: true
          multiple_candidates: "pending_review"
          do_not_merge_release_batches: true
      - node: "query_95306_by_inspection_notice"
        action: ["query_95306_shipments_by_window_or_wagon_numbers"]
        rule:
          prefer_wagon_numbers: true
          fallback_window_minutes: 60
          rail_db_read_only: true
      - node: "create_wagon_shipments"
        action: ["create_wagon_shipments", "bind_wagons_to_release_batch", "check_existing_wagon_shipments"]
        rule:
          auto_apply_when_count_matches_and_no_conflict: true
          duplicate_same_batch: "skip_existing"
          duplicate_other_batch: "conflict"
          do_not_merge_release_batches: true
      - node: "enter_tracking_phase"
        next: ["track_95306_status"]

  business_text_flow:
    description: "business text context only; not main trigger"
    trigger:
      groups: ["GROUP001", "GROUP013"]
      message_types: ["text"]
    steps:
      - node: "capture_business_context"
        action: ["store_message_context"]
        rule:
          text_is_context_only: true
          inspection_notice_is_primary: true

  tracking_flow:
    description: "95306 tracking until confirmed received"
    trigger: ["wagon_shipments_exists"]
    steps:
      - node: "track_95306_status"
        action: ["poll_shipment_snapshots"]
      - node: "arrived_destination"
        conditions:
          95306_status: "到站"
        action: ["update_wagon_arrival_status", "update_dashboard_state"]
      - node: "delivered"
        conditions:
          95306_status: ["交付", "货物已交付", "已交付"]
        action: ["update_dispatch_status", "mark_confirmed_received"]
      - node: "close_batch_if_all_confirmed"
        conditions:
          all_wagons_confirmed_received: true
        action: ["close_dashboard_state", "mark_release_batch_completed"]

  report_delivery_flow:
    description: "departure report delivery"
    output_templates:
      # R78: 朝阳钢铁的发运 excel,5 列,极简
      # 货票时间用 yyyymmddhhmm00 文本格式(强制 number_format='@' 防止
      # Excel 把它认成科学计数);全列可用单一时间(取本批首车的制票时间)
      departure_excel:
        business_name: "锦州港铁矿发运表"
        # ── 业务铁律:车号顺序 = 检装车通知单 seq 顺序 ──────────────
        # excel 行序必须等于通知单从机车头到机车尾的物理列车顺序,因为这是
        # 收货端核对、人工查表的默认锚点。chain 走 95306 反查时,**用 95306
        # 做"装/排"判断**,但车号排序**保留通知单 seq**。95306 多出来的
        # last-minute 换车 / OCR 错字修正(通知单 OCR 错 → 95306 实有)
        # 没法精准插回原位,追加到末尾。详 [[dispatch-event-excel-rule]] +
        # [[release-batch-business-rules]] "列车物理排序"约定。
        row_order_rule: "by_inspection_notice_seq"
        file_naming:
          pattern: "chaoyang_{car_count}cars.xlsx"
          car_count_source: "export_row_count"
        workbook:
          sheet_name: "Sheet1"
          # 朝阳的 excel 没标题行,header 就是第 1 行
          header_row: 1
          data_start_row: 2
        columns:
          - key: "seq"
            header: "rowNo"
            fill_rule: "从 1 开始自增"
          - key: "wagon_no"
            header: "铁路车号"
            fill_rule: "wagon_shipments.car_no"
          - key: "ticketed_at_compact_text"
            header: "货票时间"
            fill_rule: >
              格式 yyyymmddhhmm00。强制写成文本(number_format='@'),
              避免 Excel 把它当数字算成科学计数。全列共用一个时间
              (取本批 wagon_shipments 中最早的 ticketed_at 截取到分钟 + '00')
            cell_format: "@"
          - key: "origin_name_fixed"
            header: "发站名称"
            fill_rule: "固定:高桥镇"
            constant: "高桥镇"
          - key: "antifreeze_flag"
            header: "防冻标记"
            fill_rule: "固定:1"
            constant: "1"
        style:
          table:
            bordered_range: "A1:E{last_data_row}"
            border_style: "thin"
            apply_border_to_header: true
            apply_border_to_body: true
            body_main_structure_has_border: true
    steps:
      - node: "generate_departure_excel"
        action: ["generate_departure_excel_task"]
        report_artifact:
          type: "departure_report"
          # template_path 留作未来美术模板;当前生成代码完全 yaml 驱动,不依赖文件
          template_path: ""
          filename_pattern: "chaoyang_{car_count}cars.xlsx"
          generate_after: "departure_records_committed"
      - node: "generate_factory_json"
        action: ["generate_factory_transport_json_task"]
      # 程序只看配置 — 不再区分"测试 / 生产"阶段。当前统一发到数据单发群
      # [GROUP013];日后真正上线发朝阳钢铁业务群,直接把 target_group 改成
      # ["GROUP004"](朝阳钢铁发运群)即可,无须改代码。
      - node: "send_report"
        target_group: ["GROUP013"]
        action: ["send_excel_task"]

  # ── 收货人系统上传(朝阳钢铁专属,2026-06-02 新增) ─────────────
  # 跟 report_delivery_flow 并行的下游:发 excel 给微信群是给"人"看,
  # 上传到鞍钢门户是给"收货系统"。两个不冲突,chain 一并执行。
  consignee_upload_flow:
    description: "上传车皮明细到鞍钢门户(朝阳钢铁的母公司收货系统)"
    target_system:
      type: "ansteel_portal"
      base_url: "https://56.ansteel.com.cn"
      account: "CWL20085"       # 朱峰,鞍钢汽车运输有限责任公司(party_b)
      app_name: "AGMPM1"
      company_code: "00047800"   # 朝阳钢铁
    # ★ 业务铁律:每次 upload 必须紧跟 verify(同一进程内),
    #   反查 wagon 集合 = 上传 wagon 集合 才算成功。
    #   实现:src/sop_hub/external/chaoyang_ansteel/upload_wagons.upload_and_verify
    upload_after_verify: true
    upload_module: "sop_hub.external.chaoyang_ansteel.upload_wagons"
    apis:
      query_plan: "AGM4M.wmwm01_inq_v1"    # 按时间窗查 plan
      query_wagons: "AGM4M.wmwm19_inq_v"   # 入参 plan row,返回 wagon 列表
      insert_wagons: "AGM4M.wmwm19_ins_v"  # 入参 12 字段 × N 行
    payload_constants:
      # 每行 12 字段中 4 个常量:
      fs_name: "高桥镇"
      antifreeze_flag: "1"
      # 其余从 plan 复制:REC_ID / MT_ID / TRANSPORT_PLAN_NO /
      # SHIP_CNAME / GOODS_CODE / BUY_ORDER_NO(=WAYBILL_NO)
      # 每行不同:WAGONNO(车号) / WAYBILL_TIME(YYYYMMDDHHMMSS)
      # uuid:Python uuid.uuid4() 即可
    verify_sleep_seconds: 2
    delete_granularity_note: |
      朝阳系统的"列"= 一次上传的 batch。
      用户实测:删除任何 1 车 → 整列全删。
      所以"列"在朝阳系统内是不可分原子单位,跟我们的检装车通知单 = 一列对应。
    steps:
      - node: "upload_wagon_batch"
        action: ["upload_wagons_to_ansteel"]
        conditions:
          # ship_name 必须有(infer 三层级联保证)
          require_ship_name: true
          require_loading_car_nos_non_empty: true
      - node: "verify_uploaded_wagons"
        action: ["query_wmwm19_and_compare"]
        # ★ 不允许跳过 — 上传无 verify = 失败
        required: true

runtime:
  watcher:
    enabled: true
    hot_reload: true
  idempotency:
    message:
      unique_key: ["group_id", "seq"]
    release_batch:
      unique_key: ["project_id", "ship_name", "notice_date", "cargo_name", "quantity_tons"]
    wagon_shipment:
      unique_key: ["wagon_no", "waybill_no", "release_batch_id"]
  task_resolver:
    release_notice_image:
      task_type: "ocr_extraction"
    inspection_notice_image:
      task_type: "ocr_extraction"
    create_wagon_shipments:
      task_type: "db_write"
    shipment_status_sync:
      task_type: "95306_tracking"
    departure_excel:
      task_type: "excel_generation"
    factory_json:
      task_type: "json_generation"
    report_delivery:
      task_type: "wx_delivery"

exceptions:
  release_notice_ocr_incomplete: ["create_manual_review_task", "preserve_original_image"]
  inspection_notice_ocr_incomplete: ["create_manual_review_task", "preserve_original_image"]
  multiple_release_batch_candidates: ["pending_review"]
  wagon_count_mismatch: ["pending_review"]
  duplicate_wagon_same_batch: ["skip_existing"]
  duplicate_wagon_other_batch: ["conflict_review"]

acceptance:
  - "出港计划通知单图片可创建或更新 release_batch。"
  - "检装车通知单图片可解析为 inspection_notice_json。"
  - "检装车通知单中的车号可用于95306只读查询。"
  - "车数一致且无冲突时自动创建 wagon_shipments。"
  - "不同放货批次不得合并。"
  - "业务文字只作上下文，不替代检装车通知单。"
  - "95306已交付默认视为 confirmed_received。"
  - "发送目标由 flows.report_delivery_flow.send_report.target_group 决定(yaml-driven)。"
