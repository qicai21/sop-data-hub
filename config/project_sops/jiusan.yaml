project_id: "jiusan"
project_name: "九三大豆铁路发运项目"
status: "active"

# 九三大豆项目初始化 SOP
# 当前边界:
# - 不自动跟踪检装车通知单.
# - 不自动识别或跟踪放货单.
# - 放货单由用户发送后手动指认项目、路线和发运信息.
# - 系统后续从 xts 账号 95306 数据查询每日发车动态.

# ── 项目元(#85 2026-06-06 补全)──────────────────────────────
# 即便九三 SOP 自动化程度低,跟踪模式跟其他全程项目一致:发车后跟到货。
project_meta:
  category: "grain_freight"
  dashboard: "normal_freight"
  origin_station: "高桥镇"
  destination_station: "新台子"
  cargo_names:
    - "大豆"
  transport_modes:
    - "铁路"
  # 已见过的循环船名(#issue-20260619 补;船名一致性核对/项目识别用)。
  known_ships:
    - "和谐1"
    - "诚信"
    - "昆娜"
    - "玛格丽特"
  has_inspection_notice: false
  departure_confirmation_source: "rail95306_xts_account"
  # 全程跟踪到 confirmed_received。九三大豆结算同样依赖到货,跟 jilin/中唐
  # 同模式。当前 SOP 自动化未实现的部分不影响 lifecycle 语义。
  lifecycle:
    mode: "full_track_to_received"
    rationale: "粮食结算依赖到货时间;wagon 全部到货才标 confirmed_received"
  # 装车重量(2026-06-15 收口,替代 sync 脚本里的硬算常量):
  #   集装箱 lot(transport_mode 含"集装箱")→ box 数 × 28.4t,数据在
  #     wagon_container_shipments(box 级)→ 走 container 源。
  #   散粮/整车 lot → 按车型标载:L70=69t,其余(L16/L18)=61t,数据在
  #     wagon_shipments → 走 bulk 源(默认)。
  shipped_weight_rule:
    container:
      per_box:
        op: to_float
        value: 28.4
    bulk:
      per_wagon:
        op: lookup_by_prefix
        value: "$wagon.car_model"
        prefix_map:
          L70: 69
        on_miss: 61

rail95306:
  account: "xts"
  cargo_name: "大豆"
  origin_station: "高桥镇"
  primary_routes:
    - mode: "container"
      destination_station: "新台子"
      private_line: "三三〇处专用线"
      final_destination: "九三集团铁岭大豆科技有限公司工厂院内"
      note: "集装箱常规路线, 三三〇处专用线卸车后汽运短倒至工厂"
    - mode: "bulk_grain_wagon"
      wagon_alias: "K车"
      destination_station: "新台子"
      private_line: "九三集团铁岭大豆科技有限公司专用线"
      final_destination: "九三集团铁岭大豆科技有限公司工厂院内"
      note: "散粮车/K车常规路线, 厂内专用线直接卸货, 一次约容纳20车"
  supplemental_routes:
    - mode: "open_top_container"
      destination_station: "得胜台"
      final_destination: "九三集团铁岭大豆科技有限公司工厂院内"
      note: "新台子接卸能力不足时启用, 平时不发"

contract:
  contract_no: "JGWL-JZTS-DD-202601"
  party_a: "锦州港物流发展有限公司"
  party_b: "锦州新铁晟港口物流有限公司"
  cargo_name: "大豆"
  trade_type: "外贸进口"
  valid_from: "2026-01-01"
  valid_to: "2026-12-31"
  doc_path: "/Users/qicai21/projects/repos/sop-data-hub/data/contracts/jiusan_soybean/物流发展-铁盛2026大豆合同.docx"
  pricing_routes:
    - code: "A"
      mode: "集装箱"
      route: "锦州港仓库 -> 新台子/三三〇处专用线 -> 汽运短倒至九三工厂"
      tax_included_price: 65.43
      unit: "元/吨"
    - code: "B"
      mode: "铁路敞顶箱"
      route: "锦州港仓库 -> 得胜台 -> 汽运倒运至九三工厂"
      tax_included_price: 65.60
      unit: "元/吨"
      route_role: "supplemental"
    - code: "C"
      mode: "散粮车/K车"
      route: "锦州港仓库 -> 新台子/九三集团铁岭大豆科技有限公司专用线 -> 直接入厂"
      tax_included_price: 65.13
      unit: "元/吨"

# ── 费用结构(先落 route C 散粮线)──────────────────────────────
# 说明:
# - route_c_income = 对客户收入口径(合同价)
# - nrf_cost       = 95306 实际票面金额(分转元),不写死 rate
# - 地铁费/轨道衡/辅助作业费按当前项目档案口径落地
cost_structure:
  currency: "CNY"
  route_a_container:
    route_code: "A"
    recognition_scope: "container_batch"
    location_code: "三三〇处专用线"
    weight_per_box: 28.4
    items:
      - {code: route_a_income, name: "路线A运输收入", side: income, rate: 65.43, base: railway_billing_weight, tax: 0.09, counterparty: "锦州港物流发展有限公司"}
      - {code: route_a_nrf_cost, name: "路线A国铁运费", side: cost, calc: actual_freight_sum, tax: 0.09, settle_party: "中国铁路"}
      - {code: route_a_metro_fee, name: "路线A地铁费", side: cost, rate: 120.0, base: box_count, tax: 0.09, settle_party: "锦州高天铁路有限责任公司"}
      - {code: route_a_transfer_fee, name: "路线A诚信倒运费", side: cost, rate: 444.0, base: box_count, tax: 0.09, settle_party: "诚信集装箱储运"}
  route_c_bulk:
    route_code: "C"
    recognition_scope: "train"
    doc_templates:
      onsite_confirm_sheet:
        template_code: "jiusan_bulk_onsite_confirm"
        template_name: "锦州港装卸辅助作业现场确认单"
        output_format: "docx"
        applicable_fee_codes:
          - "aux_bulk_loading"
          - "aux_bulk_inspection"
    items:
      - {code: route_c_income, name: "路线C运输收入", side: income, rate: 65.13, base: railway_billing_weight, tax: 0.09, counterparty: "锦州港物流发展有限公司"}
      - {code: nrf_cost, name: "国铁运费", side: cost, calc: actual_freight_sum, tax: 0.09, settle_party: "中国铁路"}
      - {code: metro_fee, name: "地铁费", side: cost, rate: 3.75, base: railway_billing_weight, tax: 0.09, settle_party: "锦州高天铁路有限责任公司"}
      - {code: track_scale, name: "轨道衡费", side: cost, rate: 0.70, base: railway_billing_weight, tax: 0.06, settle_party: "中铁外服锦州分公司"}
      - {code: aux_bulk_loading, name: "散粮车装卸辅助作业服务", side: cost, rate: 450.0, base: car_count, tax: 0.06, settle_party: "二级公司", doc_type: "onsite_confirm_sheet", service_no: "19"}
      - {code: aux_bulk_inspection, name: "散粮车车体检查及作业现场检查服务", side: cost, rate: 200.0, base: car_count, tax: 0.06, settle_party: "二级公司", doc_type: "onsite_confirm_sheet", service_no: "20"}

listening_tasks:
  - group_id: "GROUP013"
    group_lookup_id: "[GROUP013]"
    group_name: "数据单发群"
    wxid: "56327225598@chatroom"
    listen_options:
      image: true
      text: true
      file: true
    pull_image: true
    routing:
      - message_type: "*"
        trigger_condition: "manual_designation_required"
        target_node: "archive_for_manual_release_setup"
        save_db: true

  # 九三大豆发运群(2026-06-21 接入)。两类跟踪目标:发运晨报 + 薛雪红发运报表。
  - group_id: "GROUP093"
    group_lookup_id: "[GROUP093]"
    group_name: "九三大豆发运群"
    wxid: "18894028363@chatroom"   # 2026-06-21 从 WeChat contact.db 检索(remark=九三大豆发运群-[GROUP093] 确认)
    listen_options:
      text: true
      file: true
      image: true
    pull_image: false
    pull_file: true
    routing:
      # ① 发运晨报(发送人:营口铁晟-魏庆凯)。锚点:"截止" + "【锦州港口装车情况】"(含"*日")。
      #    内容=当日装车/发运/在途/港内剩余重空箱/承认车 situational 汇总。
      - message_type: "text"
        sender_name: "营口铁晟-魏庆凯"
        match_any: ["截止", "【锦州港口装车情况】"]
        target_node: "capture_jiusan_morning_report"
        save_db: true
        note: "晨报入库存档(situational);95306 仍为发运数据权威,晨报供盘点对照"
      # ② 发运报表 xlsx(发送人:铁晟 薛雪红)。文件名:<船名> 散粮车<日期>.xlsx。
      #    每 sheet=日期、列=序号|车型|车号|净重|标重,提供散粮**分船分票**事实源。
      - message_type: "file"
        sender_name: "铁晟 薛雪红"
        filename_match: "散粮车"
        filename_ext: ".xlsx"
        target_node: "ingest_bulk_loading_notice"
        handler: "scripts/ingest_bulk_loading_notice.py"
        save_db: true
        note: "落 bulk_loading_notice_wagon(船名取自文件名,car_no+日期反查95306 ydid),随后 sync 按船重路由。⚠️95306 数据权威最高,本表只提供分票"
