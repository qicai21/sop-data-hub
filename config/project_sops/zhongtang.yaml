project_id: "zhongtang_special_steel"
project_name: "中唐特钢铁矿发运项目"
status: "active"
sop_type: "freight_rail"
source_of_truth: "git"

# ── 项目元信息(数据约束的入口,被 ingest/filter 代码读取)─────────────
# 参考 jilin_jingang 和 chaoyang 的 project_meta 结构。
project_meta:
  category: "iron_ore"
  dashboard: "normal_freight"
  origin_station: "高桥镇"
  destination_station: "汐子"
  cargo_names:
    - "铁矿"
    - "铁矿粉"
  # #98 filter:本项目合同明确只走铁路。出港通知单的 remarks 里"(公路 X)"
  # 这种 ingest 时按 scope 过滤掉(2026-06-04 跟 jilin 蓝鳍同性质问题)。
  transport_modes:
    - "铁路"
  has_inspection_notice: true
  # ── 跟踪模式(#85 2026-06-06)────────────────────────────────
  # 全程 "full_track_to_received":中唐发运后,继续 95306 轮询到 wagon
  # 到货,直到全部到货才标 confirmed_received。海铁联运两段船,商务上
  # 关心到港时间(汐子),不到货不能闭环。
  lifecycle:
    mode: "full_track_to_received"
    rationale: "海铁联运商务依赖到港时间;wagon 全部到货后才标 confirmed_received"
  # 已见过的船名,辅助识别 / 文字补充货运信息时对船名一致性核对。
  # 中唐是海铁联运两段船:A船青岛进口 → B船内贸转水到锦州港。
  # 数据库:import_ship_name 存大船(A),ship_name 存到港船(B)。
  # 当中唐特钢发运群的补充货运消息船名 ≠ 出港通知单船名时:
  #   import_ship_name <- 补充货运消息船名(进口段大船)
  #   ship_name        <- 出港通知单船名(到港小船)
  # 一致时只填 ship_name,import_ship_name 留空。
  known_ships:
    - "丰收散运"
    - "鞍子河"
    - "马兰探险"
    - "贝拉"
    - "环球信任"
    - "宝丽"
  # OCR 常见误识(汐子 ⇄ 沙子),ingest 时归一到汐子。
  destination_aliases:
    汐子: ["沙子"]

  # ── 装车重量换算规则(中唐特钢约定) ──────────────────────────────
  # 检装车通知单的 car_model 经常以 "70/64K/62AK/70E/70H" 形式出现。
  # C70 系列(70/70E/70H)→ 标载 70 吨 → 实际装 70.2 吨
  # C64K → 标载 61 吨 → 实际装 64.5 吨
  # C62/62A/62AK → 标载 60 吨 → 实际装 63.5 吨
  # shipped_weight.py 读的是 project_meta.shipped_weight_rule。
  shipped_weight_rule:
    per_wagon:
      op: lookup
      key:
        op: coalesce
        choices:
          - op: to_float
            value: $wagon.marked_weight
          - op: lookup_by_prefix
            value: $wagon.car_model
            prefix_map:
              C70: 70
              C64: 61
              C62: 60
              "70": 70
              "64": 61
              "62": 60
      table:
        "70": 70.2
        "61": 64.5
        "60": 63.5
      on_miss: pending_review

# ── 费用结构(单一真相)#P001-billing 2026-06-18 ───────────────────
# 发完车 → billing_generate 按本块逐项生成 billing_cost_item。
# base: railway_billing_weight=铁路计费重量(标载和) | settlement_weight=结算重量(工厂入场过磅) | car_count=车数
# side: income=向客户(中唐特钢)收 | cost=对外付 | passthrough=代收代付(收支相抵不计利润)
# settle_party 多为数据驱动(随结算台账/船),config 给默认值;car 级变更走 billing_settle_override。
cost_structure:
  currency: "CNY"
  default_base: "railway_billing_weight"
  # 包干费(含税)37.02 元/吨 = income 四项之和
  items:
    # ① 收入(向客户收)
    - {code: nrf_income,   name: "国铁运费(收)",   side: income, rate: 19.59, base: railway_billing_weight, tax: 0.09, invoice_type: "9%专票"}
    - {code: logistics_fee, name: "物流服务费",     side: income, rate: 7.20,  base: railway_billing_weight, tax: 0.06, invoice_type: "6%专票", note: "待合同核实"}
    - {code: rcf_income,   name: "铁路建设基金(收)", side: income, rate: 3.73,  base: railway_billing_weight, tax: 0.00, invoice_type: "不征税普票"}
    - {code: arrival_handling_income, name: "到站装卸费(代收)", side: income, rate: 6.50, base: railway_billing_weight, tax: 0.06, invoice_type: "6%专票", passthrough_of: "arrival_handling"}
    # ② 运营成本(对外付)
    - {code: nrf_cost,     name: "国铁运费(付)",   side: cost, rate: 17.46, base: railway_billing_weight, tax: 0.09, settle_party: "中国铁路沈阳局集团有限公司"}
    - {code: rcf_cost,     name: "铁路建设基金(付)", side: cost, rate: 3.73, base: railway_billing_weight, tax: 0.00, settle_party: "中国铁路沈阳局集团有限公司"}
    - {code: metro_fee,    name: "地铁费",         side: cost, rate: 4.20, base: railway_billing_weight, tax: 0.06, settle_party: "锦州高天铁路有限责任公司", note: "加权 煤4-5线70%×4.50+14/15道30%×3.50"}
    - {code: track_scale,  name: "轨道衡费",       side: cost, rate: 0.70, base: railway_billing_weight, tax: 0.06, settle_party: "中铁外服锦州分公司"}
    # ★ 到站装卸费(代付):结算方默认铁发,可被 billing_settle_override 改到中唐特钢(运达7 实证)
    - {code: arrival_handling, name: "到站装卸费(付)", side: passthrough, rate: 6.50, base: railway_billing_weight, tax: 0.06, settle_party: "铁发", note: "结算方可变更;运达7 起部分船改直接结中唐特钢"}
    - {code: wagon_occupancy, name: "货车占用费",   side: cost, rate: 0.64, base: railway_billing_weight, tax: 0.06, settle_party: "锦州高天铁路有限责任公司", note: "≥300万吨档"}
    # ③ 辅助作业费(元/车,转二级公司,利润分配工具)
    - {code: aux_inspection, name: "车辆检查服务(检车)",   side: cost, rate: 74.75, base: car_count, tax: 0.06, settle_party: "二级公司"}
    - {code: aux_marking,    name: "装车划线服务",         side: cost, rate: 74.75, base: car_count, tax: 0.06, settle_party: "二级公司"}
    - {code: aux_sealing,    name: "堵漏封堵服务",         side: cost, rate: 32.50, base: car_count, tax: 0.06, settle_party: "二级公司"}

# ── 流程编排(主要给 departure_excel 提供模板;executor 是 hard-coded)─
flows:
  # 发运 excel 生成 + 发到指定群
  report_delivery_flow:
    description: "检装车成链后,生成发运 excel 发到目标群"
    steps:
      # 程序只看配置 — 不再区分"测试 / 生产"阶段。当前统一发到数据单发群
      # [GROUP013];日后真正上线直接发中唐特钢发运群,把 target_group 改成
      # ["GROUP003"](中唐特钢发运群)即可,无须改代码。
      - node: "send_report"
        target_group: ["GROUP013"]
        action: ["send_excel_task"]
    # excel 模板(由 departure_excel.py 完全 yaml 驱动)
    output_templates:
      departure_excel:
        business_name: "中唐特钢汐子站铁矿粉发运表"
        # ── 业务铁律:车号顺序 = 检装车通知单 seq 顺序 ──────────────
        # excel 行序 = 列车机车头到机车尾的物理装载顺序,跟收货端核对、人工
        # 查表的默认锚点。chain 走 95306 反查时,用 95306 做"装/排"判断,
        # 但车号排序保留通知单 seq。OCR 错抽的修正车号 / last-minute 换车
        # 追加到末尾。详 [[dispatch-event-excel-rule]] + [[release-batch-business-rules]]
        # "列车物理排序"约定。
        row_order_rule: "by_inspection_notice_seq"
        file_naming:
          pattern: "zhongtang_{car_count}cars.xlsx"
          car_count_source: "export_row_count"
        workbook:
          sheet_name: "Sheet1"
          header_row: 1
          data_start_row: 2
        columns:
          - key: "seq"
            header: "rowNo"
            fill_rule: "从 1 开始自增"
          - key: "wagon_no"
            header: "铁路车号"
            fill_rule: "wagon_shipments.car_no"
          - key: "ticketed_at_compact_text"
            header: "货票时间"
            fill_rule: "yyyymmddhhmm00 文本(避免 Excel 科学计数)"
            cell_format: "@"
          - key: "origin_name_fixed"
            header: "发站名称"
            fill_rule: "固定:高桥镇"
            constant: "高桥镇"
          - key: "destination_name_fixed"
            header: "到站名称"
            fill_rule: "固定:汐子"
            constant: "汐子"
        style:
          table:
            bordered_range: "A1:E{last_data_row}"
            border_style: "thin"
            apply_border_to_header: true
            apply_border_to_body: true
        # ── 中唐特钢特有 footer:底部 5 行业务信息(用户口述 + PDF SOP)──
        footer:
          start_row_gap: 1
          label_col: "A"
          value_col: "B"
          value_merge_end_col: "E"
          rows:
            - label: "货物品名"
              from_release_batch: "cargo_product_name"
            - label: "计划号"
              from_release_batch: "plan_id"
            - label: "合同号"
              from_release_batch: "contract_no"
            - label: "进口船名"
              from_release_batch: "import_ship_name"
            - label: "到港船名"
              from_release_batch: "ship_name"

# 该项目需要的监听任务清单
listening_tasks:
  - group_id: "GROUP003"
    group_lookup_id: "[GROUP003]"
    group_name: "中唐特钢发运群"
    wxid: "38739555499@chatroom"
    listen_options:
      image: true
      text: true
    pull_image: true
    # 触发后进入的业务流
    routing:
      - message_type: "text"
        trigger_condition: "match_text_template"
        target_node: "create_release_batch"
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单]"
        target_node: "process_business_image"

  - group_id: "GROUP001"
    group_lookup_id: "[GROUP001]"
    group_name: "铁晟业务工作群"
    wxid: "18919596289@chatroom"
    listen_options:
      image: true
    pull_image: true
    routing:
      - message_type: "image"
        trigger_condition: "category_in:[检装车通知单]"
        target_node: "process_inspection_slip"
        # 2026-06-06:dev/production 双轨已废弃。真正的发送目标在 yaml
        # flows.report_delivery_flow.send_report.target_group(当前 ["GROUP013"]
        # 数据单发群)。listening_tasks 只负责"听 + 路由触发节点",不再带
        # 收件人。

  - group_id: "GROUP013"
    group_lookup_id: "[GROUP013]"
    group_name: "数据单发群"
    wxid: "56327225598@chatroom"
    source_role: "supplemental"
    listen_options:
      image: true
      text: true
      file: true
    pull_image: true
    routing:
      - message_type: "text"
        trigger_condition: "match_text_template"
        target_node: "create_release_batch"
        supplemental: true
      - message_type: "image"
        trigger_condition: "category_in:[出港计划通知单]"
        target_node: "create_release_batch"
        supplemental: true
