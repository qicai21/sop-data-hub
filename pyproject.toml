[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-data-hub"
version = "1.0.0"
description = "运营数据枢纽 — 图像识别、数据处理与Agent自动化"
# datetime.UTC and other 3.12+ usage; production runs 3.14
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
    "Pillow>=9.0",
    "python-docx>=1.2.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Legacy alias: yaml extra used to be required; core deps now include PyYAML.
yaml = ["PyYAML>=6.0"]

[project.scripts]
sop-hub = "sop_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast unit tests",
    "functional: cross-module temp DBs / fixtures",
    "live: machine-local readonly; requires SOP_TEST_LIVE=1",
    "replay: fixture replay (subset of functional)",
]
