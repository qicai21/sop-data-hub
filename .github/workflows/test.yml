# Portable gate: unit + functional only (no live, no production DB).
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python >=3.12; production is 3.14
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Portable tests via make test
        env:
          # Makefile PY defaults to .venv; point at the active CI interpreter.
          PY: PYTHONPATH=src python
        run: make test
